name: ragpolyglot

services:
  postgresql:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - rag-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: [.env]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - rag-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rag-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  document-service:
    build:
      context: ./apps/document-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:5000}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      AUTO_RETRY_MAX_RETRIES: ${AUTO_RETRY_MAX_RETRIES:-3}
      AUTO_RETRY_MIN_AGE_MINUTES: ${AUTO_RETRY_MIN_AGE_MINUTES:-1}
      AUTO_RETRY_LIMIT: ${AUTO_RETRY_LIMIT:-10}
    ports:
      - '${DOCUMENT_SERVICE_PORT:-5000}:5000'
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:5000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-network

  llm-stub:
    profiles: [test]
    build:
      context: ./tools/llm-stub
      dockerfile: Dockerfile
    environment:
      STUB_LLM_ANSWER: ${STUB_LLM_ANSWER:-Integration test answer from stub LLM.}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-3000}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag-network

  rag-worker:
    build:
      context: ./apps/rag-worker
      dockerfile: Dockerfile
      args:
        INSTALL_OCR_LANGS: ${INSTALL_OCR_LANGS:-1}
        INSTALL_KRAKEN: ${INSTALL_KRAKEN:-1}
        KRAKEN_TORCH: ${KRAKEN_TORCH:-cu124}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RAG_WORKER_HTTP_ADDR: ${RAG_WORKER_HTTP_ADDR:-:8081}
      EMBEDDING_FALLBACK: ${EMBEDDING_FALLBACK:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      LMSTUDIO_API_URL: ${LMSTUDIO_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-10000000}
      MAX_CHUNKS: ${MAX_CHUNKS:-5000}
      WORK_POOL_SLOTS: ${WORK_POOL_SLOTS:-4}
      OCR_POOL_SLOTS: ${OCR_POOL_SLOTS:-}
      EMBED_POOL_SLOTS: ${EMBED_POOL_SLOTS:-2}
      WORK_MEMORY_BUDGET_MB: ${WORK_MEMORY_BUDGET_MB:-4096}
      EMBED_MEMORY_BUDGET_MB: ${EMBED_MEMORY_BUDGET_MB:-}
      OCR_PAGE_MEMORY_MB: ${OCR_PAGE_MEMORY_MB:-64}
      EMBED_BATCH_MEMORY_MB: ${EMBED_BATCH_MEMORY_MB:-32}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-150}
      KRAKEN_GRC_MODEL: ${KRAKEN_GRC_MODEL:-/models/grc.mlmodel}
      KRAKEN_DEVICE: ${KRAKEN_DEVICE:-cuda:0}
      KRAKEN_GPU_CONCURRENT: ${KRAKEN_GPU_CONCURRENT:-}
      KRAKEN_BATCH_PAGES: ${KRAKEN_BATCH_PAGES:-64}
      KRAKEN_THREADS: ${KRAKEN_THREADS:-}
      KRAKEN_PRECISION: ${KRAKEN_PRECISION:-}
      KRAKEN_LINE_BATCH: ${KRAKEN_LINE_BATCH:-}
      KRAKEN_LINE_WORKERS: ${KRAKEN_LINE_WORKERS:-}
      KRAKEN_VRAM_BUDGET_MB: ${KRAKEN_VRAM_BUDGET_MB:-16384}
      KRAKEN_VRAM_PAGE_MB: ${KRAKEN_VRAM_PAGE_MB:-256}
      KRAKEN_PAGE_MEMORY_MB: ${KRAKEN_PAGE_MEMORY_MB:-256}
      FAST_INGEST_PREFETCH: ${FAST_INGEST_PREFETCH:-4}
      OCR_INGEST_PREFETCH: ${OCR_INGEST_PREFETCH:-1}
      INGEST_PREFETCH: ${INGEST_PREFETCH:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - uploads_data:${UPLOADS_DIR:-/uploads}
    ports:
      - '${RAG_WORKER_PORT:-8081}:8081'
    gpus: all
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:8081/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rag-network

  event-processor:
    build:
      context: ./apps/event-processor
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      EVENT_PROCESSOR_HTTP_ADDR: ${EVENT_PROCESSOR_HTTP_ADDR:-:8082}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:5000}
      AUTO_RETRY_INTERVAL_MINUTES: ${AUTO_RETRY_INTERVAL_MINUTES:-1}
    ports:
      - '${EVENT_PROCESSOR_PORT:-8082}:8082'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      document-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8082/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rag-network

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL}
      RAG_WORKER_URL: ${RAG_WORKER_URL}
      EVENT_PROCESSOR_URL: ${EVENT_PROCESSOR_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-314572800}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-10000}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-600}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    volumes:
      - uploads_data:${UPLOADS_DIR:-/uploads}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      postgresql:
        condition: service_healthy
      document-service:
        condition: service_healthy
      rag-worker:
        condition: service_healthy
      event-processor:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.status===200||r.status===503?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-network

  pgadmin:
    profiles: ['tools']
    image: dpage/pgadmin4:8
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT:-80}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - rag-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:
  uploads_data:

networks:
  rag-network:
    driver: bridge
