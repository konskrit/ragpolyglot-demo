name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            apps/rag-worker/go.sum
            apps/event-processor/go.sum

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Derive Nx SHAs
        id: setSHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint and unit test
        run: |
          EXCLUDE='react-frontend-e2e,api-gateway-e2e'
          if [ "${{ steps.setSHAs.outputs.noPreviousBuild }}" = "true" ]; then
            npx nx run-many -t lint test --exclude="$EXCLUDE"
          else
            npx nx affected -t lint test --exclude="$EXCLUDE"
          fi

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: cp .env.example .env

      - run: docker compose --profile test --env-file .env --env-file .env.test.example -p ragpolyglot-ci up -d --wait --build

      - run: npx nx run api-gateway-e2e:e2e
        env:
          STUB_LLM_ANSWER: Integration test answer from stub LLM.

      - if: always()
        run: docker compose --profile test -p ragpolyglot-ci down -v
